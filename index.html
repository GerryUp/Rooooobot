<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>预约发货</title>
  <style>
    :root {
      --teal: #83cfd9;
      --teal-dark: #5eb8c4;
      --text: #303133;
      --label: #606266;
      --muted: #909399;
      --placeholder: #c0c4cc;
      --line: #e8eaec;
      --border: #dcdfe6;
      --pink: #fd89a4;
      --header: #f8f8f9;
      --page: #f0f2f5;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--page);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif;
      font-size: 13px;
      line-height: 1.4;
    }
    button, input, select { font-family: inherit; font-size: 13px; }
    .page {
      background: #fff;
      min-height: 100vh;
      margin: 10px;
      padding: 14px 16px 56px;
      min-width: 1180px;
    }
    h1 {
      margin: 2px 0 16px;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.5px;
    }
    .sec { margin: 0 0 2px; }
    .sec-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 2px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .sec-toggle:hover { color: #1f2329; }
    .chev { display: block; transition: transform .15s ease; }
    .sec-toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
    .sec-body { padding: 2px 0 8px; }
    .basic {
      display: grid;
      grid-template-columns: 168px minmax(0, 1fr);
      align-items: center;
      padding: 4px 0 8px;
    }
    .avatar {
      width: 72px;
      height: 72px;
      display: block;
      justify-self: start;
      margin-left: 2px;
    }
    .fields {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr 1.4fr 1.15fr;
      column-gap: 18px;
      row-gap: 18px;
      align-items: center;
    }
    .field {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      min-width: 0;
    }
    .lab { color: var(--label); white-space: nowrap; flex: none; }
    .val { color: var(--text); white-space: nowrap; }
    .star { color: var(--pink); font-style: normal; margin-right: 2px; }
    .link {
      color: var(--teal);
      text-decoration: none;
      cursor: pointer;
    }
    .link:hover { color: var(--teal-dark); }
    .radios { display: inline-flex; align-items: center; gap: 16px; }
    .radio {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--label);
      cursor: pointer;
      user-select: none;
    }
    .radio input {
      appearance: none;
      width: 14px;
      height: 14px;
      margin: 0;
      border: 1px solid #d5d8de;
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .radio input:checked { border-color: var(--teal); }
    .radio input:checked::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
    }
    .combo { position: relative; display: inline-flex; align-items: center; }
    .combo-ico {
      position: absolute;
      left: 8px;
      pointer-events: none;
      color: var(--placeholder);
    }
    .ctl, .sel {
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: #fff;
      color: var(--label);
      outline: none;
      padding: 0 8px;
    }
    .ctl { width: 168px; }
    .ctl.date { width: 118px; padding-left: 28px; color: var(--label); }
    .ctl.date:not(.has-value) { color: transparent; }
    .ctl.time {
      width: 104px;
      padding-left: 28px;
      padding-right: 22px;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23c0c4cc' stroke-width='1.2'/></svg>");
      background-repeat: no-repeat;
      background-position: right 8px center;
    }
    .ctl.time.is-placeholder { color: var(--placeholder); }
    .sel {
      width: 168px;
      padding-right: 26px;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23c0c4cc' stroke-width='1.2'/></svg>");
      background-repeat: no-repeat;
      background-position: right 8px center;
      cursor: pointer;
    }
    .ctl:focus, .sel:focus { border-color: var(--teal); }
    .ctl::placeholder { color: var(--placeholder); }
    .logi { padding: 6px 0 2px 2px; }
    .logi-row {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
      padding: 4px 0;
    }
    .way { width: 200px; }
    .company { width: 188px; }
    .waybill { width: 280px; }
    .attach-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0 4px;
      color: var(--label);
    }
    .file-btn {
      color: var(--teal);
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
      font-size: 13px;
    }
    .file-btn:hover { color: var(--teal-dark); }
    .file-name {
      color: var(--muted);
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 6px 0 8px;
      padding-left: 2px;
    }
    .toolbar-left { display: flex; align-items: center; gap: 8px; flex: none; }
    .batch-lab { color: var(--label); white-space: nowrap; }
    .batch-num { width: 168px; text-align: left; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
    .btn {
      height: 32px;
      padding: 0 14px;
      border: 0;
      border-radius: 2px;
      background: var(--teal);
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: var(--teal-dark); }
    .btn:active { background: #4eacb8; }
    .summary {
      flex: 1;
      text-align: center;
      color: var(--pink);
      font-size: 14px;
      white-space: nowrap;
    }
    .grid-btn {
      flex: none;
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      color: #3a3a3c;
      display: grid;
      place-items: center;
    }
    .grid-btn:hover { color: #000; }
    .table-wrap { overflow-x: auto; padding-bottom: 4px; }
    table {
      border-collapse: collapse;
      min-width: max-content;
      font-size: 12px;
      color: var(--label);
      font-variant-numeric: tabular-nums;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 0 8px;
      height: 40px;
      font-weight: 400;
      text-align: center;
      white-space: nowrap;
    }
    thead th {
      background: var(--header);
      color: #606266;
      height: 36px;
      font-size: 12px;
    }
    th.left, td.left { text-align: left; }
    td.sku { color: #4a4d52; padding-left: 10px; }
    .color-cell {
      text-align: left;
      padding-left: 12px;
      line-height: 1.45;
      color: #606266;
      vertical-align: middle;
    }
    .color-name { display: block; }
    .skc { display: block; }
    .box-h {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .tip {
      display: inline-flex;
      vertical-align: middle;
      margin-left: 2px;
      cursor: help;
    }
    .qty {
      width: 84px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 2px;
      text-align: center;
      color: var(--label);
      background: #fff;
      padding: 0 4px;
      font-size: 12px;
    }
    .qty::placeholder { color: var(--placeholder); }
    .qty:focus { outline: none; border-color: var(--teal); }
    tr.foot td { background: #fafbfc; height: 38px; }
    .foot-lab { text-align: right; padding-right: 14px; color: #606266; }
    .std-no { color: var(--pink); }
  </style>
</head>

  <script>
    const SKUS = [
      { sku: "WCMUT0001-BR-S", available: 2 },
      { sku: "WCMUT0001-BR-M", available: 2 },
      { sku: "WCMUT0001-BR-L", available: 2 },
      { sku: "WCMUT0001-BR-XL", available: 2 },
      { sku: "WCMUT0001-BR-XXL", available: 2 }
    ];
    const COLOR = "橙色";
    const SKC = "WCMUT0001-BR";
    const MIN_BOX = 1;
    const MAX_BOX = 20;
    const INITIAL_BOXES = 6;

    const state = {
      boxCount: INITIAL_BOXES,
      qty: SKUS.map(() => Array(INITIAL_BOXES).fill(""))
    };

    const summaryEl = document.getElementById("summary");
    const thead = document.querySelector("#matrix thead");
    const tbody = document.querySelector("#matrix tbody");
    const boxBatch = document.getElementById("boxBatch");

    const TIP = '<svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><circle cx="6.5" cy="6.5" r="6" fill="#606060"/><text x="6.5" y="9.4" text-anchor="middle" font-size="8.5" font-family="sans-serif" fill="#fff">?</text></svg>';
    const BOX_MORE = '<svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><circle cx="6.5" cy="6.5" r="5.2" fill="none" stroke="#fd89a4" stroke-width="1.1"/><path d="M5.4 4.1L8.2 6.5 5.4 8.9" fill="none" stroke="#fd89a4" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function pad(n) { return String(n).padStart(2, "0"); }

    function fillTimeOptions() {
      const sel = document.getElementById("arriveTime");
      const frag = document.createDocumentFragment();
      const blank = document.createElement("option");
      blank.value = "";
      blank.textContent = "时间";
      frag.appendChild(blank);
      for (let h = 0; h < 24; h++) {
        for (const m of [0, 30]) {
          const opt = document.createElement("option");
          opt.value = pad(h) + ":" + pad(m);
          opt.textContent = opt.value;
          frag.appendChild(opt);
        }
      }
      sel.appendChild(frag);
      sel.addEventListener("change", () => {
        sel.classList.toggle("is-placeholder", sel.value === "");
      });
    }

    function skuBooked(i) {
      return state.qty[i].reduce((sum, v) => sum + (parseInt(v, 10) || 0), 0);
    }

    function pieceTotal() {
      return SKUS.reduce((sum, _, i) => sum + skuBooked(i), 0);
    }

    function updateTotals() {
      summaryEl.textContent = "装箱总数：" + state.boxCount + "箱/" + pieceTotal() + "件";
      SKUS.forEach((item, i) => {
        const booked = skuBooked(i);
        const bookedCell = document.getElementById("booked-" + i);
        const diffCell = document.getElementById("diff-" + i);
        const stdCell = document.getElementById("std-" + i);
        if (!bookedCell) return;
        bookedCell.textContent = String(booked);
        if (booked === 0) {
          diffCell.textContent = "-";
          stdCell.textContent = "-";
          stdCell.classList.remove("std-no");
        } else {
          diffCell.textContent = String(booked - item.available);
          const ok = booked <= item.available;
          stdCell.textContent = ok ? "是" : "否";
          stdCell.classList.toggle("std-no", !ok);
        }
      });
    }

    function boxLabel(n) {
      return "箱号" + pad(n);
    }

    function renderTable() {
      const n = state.boxCount;
      let head = "<tr>";
      head += '<th class="left" style="min-width:118px">颜色/SKC</th>';
      head += '<th class="left" style="min-width:148px">SKU</th>';
      head += '<th style="min-width:72px">已发货数</th>';
      head += '<th style="min-width:84px">可预约数<span class="tip" title="当前 SKU 还可预约的件数">' + TIP + "</span></th>";
      head += '<th style="min-width:84px">本次预约数</th>';
      head += '<th style="min-width:96px">发货差异数<span class="tip" title="本次预约数减去可预约数，未填写时为 -">' + TIP + "</span></th>";
      head += '<th style="min-width:118px">是否达到发货标准</th>';
      for (let b = 1; b <= n; b++) {
        head += '<th style="min-width:102px"><span class="box-h"><i class="star">*</i>' + boxLabel(b) +
          '<span class="tip" title="箱列">' + BOX_MORE + "</span></span></th>";
      }
      head += "</tr>";
      thead.innerHTML = head;

      let body = "";
      SKUS.forEach((item, i) => {
        body += "<tr>";
        if (i === 0) {
          body += '<td class="color-cell" rowspan="' + SKUS.length + '"><span class="color-name">' + COLOR +
            '</span><span class="skc">' + SKC + "</span></td>";
        }
        body += '<td class="left sku">' + item.sku + "</td>";
        body += "<td>-</td>";
        body += "<td>" + item.available + "</td>";
        body += '<td id="booked-' + i + '">0</td>';
        body += '<td id="diff-' + i + '">-</td>';
        body += '<td id="std-' + i + '">-</td>';
        for (let b = 0; b < n; b++) {
          const val = state.qty[i][b] || "";
          body += '<td><input class="qty" inputmode="numeric" maxlength="6" placeholder="请输入" aria-label="' +
            item.sku + " " + boxLabel(b + 1) + '" data-sku="' + i + '" data-box="' + b + '" value="' + val + '"></td>';
        }
        body += "</tr>";
      });

      body += '<tr class="foot"><td class="foot-lab" colspan="7">箱子重量(KG)</td>';
      for (let b = 0; b < n; b++) body += "<td>21</td>";
      body += "</tr>";
      body += '<tr class="foot"><td class="foot-lab" colspan="7">箱规(长*宽*高)</td>';
      for (let b = 0; b < n; b++) body += "<td>63*36*30</td>";
      body += "</tr>";
      tbody.innerHTML = body;
      updateTotals();
    }

    function clampCount(raw) {
      const n = parseInt(raw, 10);
      if (!Number.isFinite(n)) return MIN_BOX;
      return Math.min(MAX_BOX, Math.max(MIN_BOX, n));
    }

    function generateBoxes() {
      const n = clampCount(boxBatch.value);
      boxBatch.value = String(n);
      state.qty.forEach((row) => {
        if (row.length > n) row.length = n;
        while (row.length < n) row.push("");
      });
      state.boxCount = n;
      renderTable();
    }

    document.querySelectorAll(".sec-toggle").forEach((btn) => {
      btn.addEventListener("click", () => {
        const open = btn.getAttribute("aria-expanded") === "true";
        btn.setAttribute("aria-expanded", open ? "false" : "true");
        const body = document.getElementById(btn.getAttribute("aria-controls"));
        body.hidden = open;
      });
    });

    document.getElementById("poLink").addEventListener("click", (e) => e.preventDefault());

    const dateInput = document.getElementById("arriveDate");
    dateInput.addEventListener("focus", () => {
      dateInput.type = "date";
      dateInput.classList.add("has-value");
      if (typeof dateInput.showPicker === "function") {
        try { dateInput.showPicker(); } catch (err) { /* 部分浏览器需用户手势，忽略 */ }
      }
    });
    dateInput.addEventListener("blur", () => {
      if (!dateInput.value) {
        dateInput.type = "text";
        dateInput.classList.remove("has-value");
      }
    });
    dateInput.addEventListener("change", () => {
      dateInput.classList.toggle("has-value", Boolean(dateInput.value));
    });

    document.getElementById("attach").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      document.getElementById("fileName").textContent = file ? file.name : "";
    });

    document.getElementById("genBtn").addEventListener("click", generateBoxes);
    boxBatch.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        generateBoxes();
      }
    });

    document.getElementById("matrix").addEventListener("input", (e) => {
      const el = e.target;
      if (!el.classList.contains("qty")) return;
      const clean = el.value.replace(/\D/g, "").slice(0, 6);
      if (el.value !== clean) el.value = clean;
      const sku = Number(el.dataset.sku);
      const box = Number(el.dataset.box);
      state.qty[sku][box] = clean;
      updateTotals();
    });

    fillTimeOptions();
    renderTable();
  </script>
</body>
</html>
